name: Metrics
on:
  # Обновлять по расписанию (каждые 12 часов)
  schedule:
    - cron: "0 */12 * * *"
  # Обновлять при пуше в основную ветку
  push:
    branches:
      - main
  # Позволяет запускать вручную
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ТВОЙ_ЛОГИН          # замени на свой username
          filename: metrics.plugin.languages.svg

          # Базовые блоки отключаем - нужна только статистика по языкам
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          