name: Metrics
on:
  # Обновлять по расписанию (каждые 12 часов)
  schedule:
    - cron: "0 */12 * * *"
  # Обновлять при пуше в основную ветку
  push:
    branches:
      - main
  # Позволяет запускать вручную
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate languages metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Forthey
          filename: metrics.plugin.languages.svg

          # Базовые блоки отключаем - нужна только статистика по языкам
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_other: yes
          plugin_languages_threshold: 1%
          plugin_languages_sections: most-used
          plugin_languages_skipped: |
            Forthey/my_thesis

          # Компактная карточка с адаптивными цветами для светлой и тёмной темы
          extras_css: |
            svg {
              font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif !important;
              color: #57606a !important;
            }

            .items-wrapper {
              box-sizing: border-box;
              padding: 10px 8px 12px;
              background: #ffffff;
              border: 1px solid #d0d7de;
              border-radius: 14px;
            }

            .items-wrapper > section:first-child {
              display: none;
            }

            h3 {
              margin: 0 0 4px !important;
              color: #0969da !important;
              font-size: 15px !important;
              font-weight: 700 !important;
              letter-spacing: 0.02em;
            }

            svg.bar {
              margin: 7px 0 9px !important;
            }

            .field.language {
              padding: 3px 0;
            }

            .field.language > .field {
              color: #24292f;
              font-weight: 600;
            }

            .field.language.details small {
              color: #6e7781 !important;
              font-weight: 500;
              font-variant-numeric: tabular-nums;
            }

            @media (prefers-color-scheme: dark) {
              svg {
                color: #c9d1d9 !important;
              }

              .items-wrapper {
                background: #0d1117;
                border-color: #30363d;
              }

              h3 {
                color: #58a6ff !important;
              }

              .field.language > .field {
                color: #f0f6fc;
              }

              .field.language.details small {
                color: #8b949e !important;
              }
            }

      - name: Generate LeetCode metrics
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: metrics.plugin.leetcode.svg

          # Статистика профиля LeetCode: задачи, навыки и последние отправки
          base: ""
          plugin_leetcode: yes
          plugin_leetcode_user: 0forthey0
          plugin_leetcode_sections: solved, skills, recent
          plugin_leetcode_limit_skills: 8
          plugin_leetcode_limit_recent: 3
