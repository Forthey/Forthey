name: Metrics
on:
  # Обновлять по расписанию (каждые 12 часов)
  schedule:
    - cron: "0 */12 * * *"
  # Обновлять при пуше в основную ветку
  push:
    branches:
      - main
  # Позволяет запускать вручную
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate languages metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Forthey
          filename: metrics.plugin.languages.svg

          # Базовые блоки отключаем - нужна только статистика по языкам
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_skipped: |
            Forthey/my_thesis

      - name: Generate lines of code metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Forthey
          filename: metrics.plugin.lines.svg

          # Показываем репозитории с наибольшими изменениями и историю за год
          base: ""
          plugin_lines: yes
          plugin_lines_sections: repositories, history
          plugin_lines_repositories_limit: 4
          plugin_lines_history_limit: 1
          plugin_lines_delay: 30
          plugin_lines_skipped: |
            Forthey/my_thesis

      - name: Generate LeetCode metrics
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: metrics.plugin.leetcode.svg

          # Статистика профиля LeetCode: задачи, навыки и последние отправки
          base: ""
          plugin_leetcode: yes
          plugin_leetcode_user: 0forthey0
          plugin_leetcode_sections: solved, skills, recent
          plugin_leetcode_limit_skills: 8
          plugin_leetcode_limit_recent: 3
